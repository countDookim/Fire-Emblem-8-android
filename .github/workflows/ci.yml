# Build, test, measure, document and publish on every push.
#   - debug APK + all JVM tests (unit, differential vs mGBA, allocation) + frame-time benchmark
#   - regenerates README progress + docs/port_map.json (committed back on master with [skip ci])
#   - Dokka site (master, 1 day), results summary (7 days), APK (branches only, 2 days) as artifacts
#   - master only: APK attached to the rolling `latest` release (install it on the phone from there)
name: ci
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: write # prune stale Gradle cache entries (tools/prune_actions_cache.py)
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FE8_ASSETS: ${{ github.workspace }}/.assets
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Fetch private ROM-repo assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          ROM_REPO_TOKEN: ${{ secrets.ROM_REPO_TOKEN }}
          ROM_REPO_DEPLOY_KEY: ${{ secrets.ROM_REPO_DEPLOY_KEY }}
        run: tools/ci_fetch_assets.sh
      - name: JVM tests + debug and release APKs
        run: ./gradlew jvmTest :app:assembleDebug :app:assembleRelease --continue --console=plain
      - name: No game content in the debug or release APK (M4-05, decision 0011)
        run: python3 tools/check_no_game_content.py --extracted "${FE8_ASSETS:-.assets}/extracted" app/build/outputs/apk/debug app/build/outputs/apk/release
      - name: Extraction reproduces ROM-repo extracted/ (M2-21)
        if: steps.assets.outputs.available == 'true'
        run: tools/ci_check_extraction.sh
      - name: Frame-time benchmark
        run: ./gradlew :testing:benchmark --console=plain
      - name: Dokka site
        if: always()
        run: ./gradlew dokkaGenerate --console=plain
      - name: Python tests (progress.py, JSON schemas)
        run: |
          python3 -m pip install --quiet --break-system-packages "jsonschema==4.26.0"
          python3 -m unittest discover -v tools/tests
      - name: Progress + port map
        if: always()
        run: python3 tools/progress.py --write
      - name: Summary
        if: always()
        run: |
          set -o pipefail
          python3 tools/ci_summary.py "${{ steps.assets.outputs.available }}" | tee ci-summary.md >> "$GITHUB_STEP_SUMMARY"
      # Actions storage is small (private repo): master's APK goes to the `latest` release only.
      - name: Upload APK (branches)
        if: always() && github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 2
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            ci-summary.md
            **/build/test-results/**/*.xml
            testing/build/reports/benchmark/frame_time.json
            docs/port_map.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Dokka site
        if: always() && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: dokka-site
          path: build/dokka/html
          if-no-files-found: warn
          retention-days: 1
      - name: Commit progress (master)
        if: success() && github.ref == 'refs/heads/master'
        run: |
          git config user.name "fe8-ci"
          git config user.email "fe8-ci@users.noreply.github.com"
          git add README.md docs/port_map.json
          if git diff --cached --quiet; then echo "progress unchanged"; exit 0; fi
          git commit -m "ci: update progress [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin master && git push -q origin HEAD:master && exit 0; sleep 5; done
          echo "::warning::could not push progress update (newer commits); next run will regenerate it"
      - name: Prune stale Actions caches (master)
        if: always() && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prune_actions_cache.py "${{ github.repository }}" || true
      - name: Rolling `latest` release (master)
        if: success() && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk fe8-debug.apk
          python3 tools/check_no_game_content.py fe8-debug.apk ci-summary.md
          gh release delete latest --cleanup-tag -y 2>/dev/null || true
          gh release create latest fe8-debug.apk ci-summary.md --target "$GITHUB_SHA" --prerelease \
            --title "latest (${GITHUB_SHA::7}, run ${GITHUB_RUN_NUMBER})" \
            --notes "Debug APK from ${GITHUB_SHA}. What's newly testable: docs/MANUAL_TEST.md. $(head -c 1500 ci-summary.md)"
